# The gate, on every PR and on main — the same shape as faebot-core's.
# The matrix runs what deploys (3.11 — the Dockerfile) and what fae runs
# locally (3.13). The ear's hearing (torch, faster-whisper, silero-vad) is an
# optional group the tests never import, so the gate installs without it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: faebot-twitch
      # faebot-core is a path dependency on a sibling checkout (pyproject):
      # the same shape as on both hosts. Core is private, so the checkout
      # needs a read token for it — CORE_READ_TOKEN, a fine-grained PAT
      # with contents: read on transfaeries/faebot-core.
      - uses: actions/checkout@v4
        with:
          repository: transfaeries/faebot-core
          path: faebot-core
          token: ${{ secrets.CORE_READ_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install poetry
        run: pipx install poetry
      - name: Install dependencies
        working-directory: faebot-twitch
        run: poetry install --no-root
      - name: Run the gate
        working-directory: faebot-twitch
        run: make all
