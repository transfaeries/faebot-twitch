[tool.poetry]
name = "faebot-twitch"
version = "0.2.0"
description = "Faebot AI Chatbot for twitch with voice integration"
authors = ["transfaeries"]
readme = "README.md"
# An app of flat modules, not a library: nothing to install as a package.
# (The Dockerfile already says --no-root; this makes it true everywhere.)
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
twitchio = "^2.8.2"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
websockets = "^14.0"
numpy = "^2.0.0"
aiohttp = "^3.11.0"
jinja2 = "^3.1.0"
# faebot-core, a sibling checkout on both hosts (dev: faebot-private/faebot-core;
# prod: /home/faebot/faebot-core). The desk the twitch-me wakes at is laid by
# core from her diary — the house walk, 2026-10-07.
faebot-core = { path = "../faebot-core", develop = true }

# The ear's hearing — VAD, Whisper, the GPU. Only the ear imports them, and
# lazily, so the body installs without: on the ear's machine,
# `poetry install --with ear`.
[tool.poetry.group.ear]
optional = true

[tool.poetry.group.ear.dependencies]
faster-whisper = "^1.0.0"
torch = "^2.0.0"
silero-vad = "^6.2.0"

[tool.poetry.group.dev.dependencies]
black = "^23.12.1"
ipython = "^8.20.0"
flake8 = "^7.3.0"
mypy = "^1.19.1"
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.1.0"
aioresponses = "^0.7.8"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["twitchio", "twitchio.*", "silero_vad", "faster_whisper", "torch"]
ignore_missing_imports = true